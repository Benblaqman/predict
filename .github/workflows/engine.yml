name: Football Prediction Engine


on:

  schedule:

    - cron: "0 */6 * * *"


  workflow_dispatch:



jobs:

  run-engine:


    runs-on: ubuntu-latest



    steps:


    - name: Checkout repository

      uses: actions/checkout@v4



    - name: Setup Python

      uses: actions/setup-python@v5

      with:

        python-version: "3.11"



    - name: Install dependencies

      run: |

        pip install -r requirements.txt



    - name: Run prediction engine

      env:

        FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}

        FOOTBALL_STATS_API: ${{ secrets.FOOTBALL_STATS_API }}

        FIXTURE_API: ${{ secrets.FIXTURE_API }}

      run: |

        python main.py



    - name: Upload dashboard data

      uses: actions/upload-artifact@v4

      with:

        name: dashboard-data

        path: data/dashboard.json
